name: 'TypeScript Quality Checks'
description: 'Run linting and typecheck for an npm package'

inputs:
  package:
    description: 'Package name'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6.5.0
      with:
        node-version: '24.x'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build workspace dependencies
      shell: bash
      # Workspace packages resolve to their built output (lib/), so the
      # patterns package must be built before patterns-ts-cli can typecheck.
      run: npm run build -w patterns-ts

    - name: Run linting
      shell: bash
      run: |
        cd ${{ inputs.package }}
        npm run lint

    - name: Run typecheck
      shell: bash
      run: |
        cd ${{ inputs.package }}
        npm run typecheck
