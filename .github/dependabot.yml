version: 2

updates:

  # NPM packages
  - package-ecosystem: "npm"
    directories:
      - '/patterns-ts'
      - '/patterns-ts-cli'
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      dev-dependencies:
        update-type: "development"
    labels: ["Dependencies"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["Infra"]
