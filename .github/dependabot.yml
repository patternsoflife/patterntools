version: 2

updates:

  # NPM packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30  # Wait for a major to settle before proposing it
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["Dependencies"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["Infra"]
