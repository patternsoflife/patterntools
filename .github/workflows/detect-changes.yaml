name: Detect Package Changes

on:
  workflow_call:
    outputs:
      packages:
        description: 'JSON array of packages with changes'
        value: ${{ jobs.detect-changes.outputs.packages}}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      patterns-ts: ${{ steps.filter.outputs.patterns-ts }}
      patterns-ts-cli: ${{ steps.filter.outputs.patterns-ts-cli }}
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          token: ''
          base: ${{ github.event.pull_request != null && github.event.pull_request.base.sha || github.event.before }}
          filters: |
            patterns-ts:
              - 'patterns-ts/**'
            patterns-ts-cli:
              - 'patterns-ts-cli/**'
