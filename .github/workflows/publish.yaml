name: Publish to npm

on:
  push:
    branches:
      - production
    paths:
      - 'patterns-ts/**'
      - 'patterns-ts-cli/**'

permissions:
  contents: read

jobs:
  detect-changes:
    uses: $/.github/workflows/detect-changes.yaml

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.packages != '[]'
    defaults:
      run:
        working-directory: ${{ matrix.package }}

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install, lint and typecheck
        uses: $/.github/actions/quality-checks-ts
        with:
          package: ${{ matrix.package }}

      - name: Build package
        run: npm run build

      - name: Add license
        run: cp "$GITHUB_WORKSPACE/LICENSE" .

      - name: Review package contents
        run: npm pack --dry-run

      - name: Pack tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          sha256sum "$RUNNER_TEMP"/pack/*.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tarball-${{ matrix.package }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-patterns:
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: contains(fromJSON(needs.detect-changes.outputs.packages), 'patterns-ts')

    steps:
      - name: Checkout publish action
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Publish package
        uses: $/.github/actions/publish-npm
        with:
          package: patterns-ts

  publish-patterns-cli:
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    # Depends on publish-patterns so a new patterns release lands on npm first.
    # !failure() still lets this run when publish-patterns was skipped (CLI-only change).
    needs: [detect-changes, build, publish-patterns]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && !failure() &&
      contains(fromJSON(needs.detect-changes.outputs.packages), 'patterns-ts-cli')

    steps:
      - name: Checkout publish action
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Publish package
        uses: $/.github/actions/publish-npm
        with:
          package: patterns-ts-cli
