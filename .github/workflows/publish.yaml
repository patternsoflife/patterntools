name: Publish to npm

on:
  push:
    branches:
      - production
    paths:
      - 'patterns-ts/**'
      - 'patterns-ts-cli/**'

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yaml

  build:
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: patterns-ts
            changed: ${{ needs.detect-changes.outputs.patterns-ts == 'true' }}
          - package: patterns-ts-cli
            changed: ${{ needs.detect-changes.outputs.patterns-ts-cli == 'true' }}

    steps:
      - name: Checkout repository
        if: matrix.changed == true
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install, lint and typecheck
        if: matrix.changed == true
        uses: $/.github/actions/quality-checks-ts
        with:
          package: ${{ matrix.package }}

      - name: Build package
        if: matrix.changed == true
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Add license
        if: matrix.changed == true
        run: cp LICENSE ${{ matrix.package }}/

      - name: Review package contents
        if: matrix.changed == true
        working-directory: ${{ matrix.package }}
        run: npm pack --dry-run

      - name: Pack tarball
        if: matrix.changed == true
        working-directory: ${{ matrix.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          sha256sum "$RUNNER_TEMP"/pack/*.tgz

      - name: Upload tarball
        if: matrix.changed == true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tarball-${{ matrix.package }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # Required for OIDC
    needs: [detect-changes, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: patterns-ts
            changed: ${{ needs.detect-changes.outputs.patterns-ts == 'true' }}
          - package: patterns-ts-cli
            changed: ${{ needs.detect-changes.outputs.patterns-ts-cli == 'true' }}

    steps:
      - name: Set up Node.js
        if: matrix.changed == true
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        if: matrix.changed == true
        uses: actions/download-artifact@v8.0.2
        with:
          name: tarball-${{ matrix.package }}
          path: ${{ runner.temp }}/pack

      - name: Publish package
        if: matrix.changed == true
        working-directory: ${{ runner.temp }}/pack
        run: |
          TARBALL=$(ls ./*.tgz)
          sha256sum "$TARBALL"
          VERSION=$(tar -xzOf "$TARBALL" package/package.json | jq -r .version)

          if echo "$VERSION" | grep -q '-'; then
            TAG=$(echo "$VERSION" | tr -cd 'a-zA-Z')
            echo "Publishing ${{ matrix.package }} version $VERSION with tag $TAG"
            npm publish "$TARBALL" --access public --tag "$TAG" --provenance
          else
            echo "Publishing ${{ matrix.package }} version $VERSION as latest"
            npm publish "$TARBALL" --access public --provenance
          fi
